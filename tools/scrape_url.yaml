  author: olostep
  label:
    en_US: Scrape URL
description:
  human:
    en_US: Scrape a web page and get its content as clean markdown. JavaScript rendering is included.
  llm: Scrape a single web page and return its main content as clean markdown. Use this when you have a URL and need its content.
